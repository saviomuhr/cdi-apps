<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plano de Ancoragem · Ilhabela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3346">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mesmo estilo do Execution/Reassessment Report · barra fixa no topo · 2 folhas A4 editáveis no próprio documento
   Folha 1: cabeçalho, módulo e checklist 1 (estrutura), 2 (condições visuais) e 3 (viga/perfil) · Folha 2: 4 fotos e assinaturas */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f6f8fb; --border:#dbe1ea; --border-mid:#c3cbd8;
  --text:#18212f; --text-mid:#475467; --text-muted:#7c879a;
  --accent:#1b5db5; --accent-dark:#144895; --accent-light:#e7effc;
  --rdc:#0b3346; --green:#1e8a4a; --green-bg:#e6f6ed; --orange:#c75f10; --orange-bg:#fef3e8;
  --danger:#b42318; --danger-bg:#fdecea; --focus:#1b5db5;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-report:Arial,Helvetica,sans-serif;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --shadow:0 8px 28px rgba(16,24,40,.14);
  --tap:40px; --fs-in:14px;
}
body.tablet{--tap:48px;--fs-in:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#18202c; --surface-2:#1e2836; --border:#2b3647; --border-mid:#3a475c;
  --text:#e7ecf3; --text-mid:#a8b4c6; --text-muted:#6f7d92;
  --accent:#5b8fe0; --accent-dark:#467bd0; --accent-light:#1a2a45;
  --rdc:#123f56; --green:#3fcf7d; --green-bg:#0f2a1b; --orange:#f5a04a; --orange-bg:#2a1a09;
  --danger:#f2867c; --danger-bg:#2c1210; --focus:#7aa7ee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202c; --surface-2:#1e2836; --border:#2b3647; --border-mid:#3a475c;
  --text:#e7ecf3; --text-mid:#a8b4c6; --text-muted:#6f7d92;
  --accent:#5b8fe0; --accent-dark:#467bd0; --accent-light:#1a2a45;
  --rdc:#123f56; --green:#3fcf7d; --green-bg:#0f2a1b; --orange:#f5a04a; --orange-bg:#2a1a09;
  --danger:#f2867c; --danger-bg:#2c1210; --focus:#7aa7ee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
body.tablet{font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.tablet svg.i{width:20px;height:20px}
[hidden]{display:none!important}

/* ── TOP BAR ── */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--rdc)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--rdc);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand-mark{background:#fff;border-radius:8px;padding:4px 8px;height:40px;display:flex;align-items:center}
.brand-mark img{height:30px;width:auto;display:block}
.brand-text{min-width:0;overflow:hidden}
.brand-title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
.save-state.saving .save-dot{background:#fbbf24}
.top-actions{display:flex;gap:8px}
.tbtn{min-height:var(--tap);padding:0 12px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
body.tablet .tbtn{font-size:14px;padding:0 14px}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.primary{background:#fff;color:var(--rdc);border-color:#fff}
.tbtn.primary:hover{background:#e8f0f5}

/* ── BUTTONS / INPUTS ── */
.btn{min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-mid);background:var(--surface);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
body.tablet .btn{font-size:14px;padding:0 16px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-mid)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 10px;font-size:12px}
body.tablet .btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.in{width:100%;min-height:var(--tap);padding:8px 12px;border:1px solid var(--border-mid);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-in)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}

/* ── DOCUMENTO ── */
.doc{max-width:900px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.page-wrap{display:flex;flex-direction:column;gap:8px}
.page-tag{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.04em;text-transform:uppercase}
.page-tag .spacer{flex:1}
.page-tag .hint{font-size:12px;color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0}
.page-tag .hint.ok{color:var(--green);font-weight:700}.page-tag .hint.todo{color:var(--orange);font-weight:600}

/* ── FOLHA A4 ── */
.xr-page{background:#fff;color:#1a1a1a;font-family:var(--font-report);border:1px solid #999;width:100%;box-shadow:0 6px 24px rgba(16,24,40,.16);position:relative}
.xr-page.dragover{outline:3px dashed var(--accent);outline-offset:4px}
.xr-head{display:grid;grid-template-columns:160px minmax(0,1fr) 170px;border-bottom:1px solid #999}
.xr-head .lg{display:flex;align-items:center;justify-content:center;padding:6px 10px}
.xr-head .lg img{max-width:100%;max-height:80px;object-fit:contain}
.xr-head .lg.l{border-right:1px solid #999}.xr-head .lg.r{border-left:1px solid #999}
.xr-head .lg.r img{max-height:50px}
.xr-head h1{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;color:#1a5fa8;padding:10px 12px;text-wrap:balance;line-height:1.2}
.xr-head h1 small{font-size:12px;font-weight:700;color:#333;margin-top:4px;letter-spacing:.04em}
.xr-fields{width:100%;border-collapse:collapse}
.xr-fields td{border-bottom:1px solid #999;padding:3px 8px;font-size:12px;color:#1a1a1a;vertical-align:middle}
.xr-fields td.k{font-weight:700;width:118px;border-right:1px solid #999;background:#f7f7f7}
.xr-fields td.k2{border-left:1px solid #999}
.xr-in{border:none;outline:none;background:transparent;font-family:var(--font-report);font-size:var(--fs-in);color:#1a1a1a;width:100%;min-height:32px;padding:0 4px;border-radius:3px}
body.tablet .xr-in{min-height:40px}
.xr-in:focus{background:#fffde7}
.xr-sel{width:100%;min-height:32px;border:1.5px solid #9aa3b0;border-radius:6px;background:#fff;color:#1a1a1a;font-family:var(--font-ui);font-weight:700;font-size:14px;padding:0 8px;margin:3px 0}
body.tablet .xr-sel{min-height:44px;font-size:16px}
.xr-sel.empty{border-color:#c75f10;color:#9a4a0c;background:#fff8f1;font-weight:600}
.xr-sel:focus{outline:none;border-color:#1b5db5;box-shadow:0 0 0 3px #e7effc}
.xr-ro{font-size:12px;padding:6px 4px;min-height:28px;display:flex;align-items:center}
.xr-work,.ck-h{background:#2c3e50;color:#fff;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;padding:7px 12px;border-bottom:1px solid #999;letter-spacing:.01em;line-height:1.25}
.ck-num{width:22px;height:22px;border-radius:50%;background:#fff;color:#2c3e50;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.ck-h .tt{flex:1;min-width:0;text-wrap:pretty}
.ck-h .who{font-size:10.5px;font-weight:600;color:#c9d3df;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}

/* checklist */

.ck-box{width:22px;height:22px;flex-shrink:0;border:1.5px solid #6b7686;border-radius:4px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;line-height:1}
.on .ck-box{background:#1b5db5;border-color:#1b5db5}
.on .ck-box::after{content:"✓"}
.ck1{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #999}
.ck1 .col+.col{border-left:1px solid #999}
.ck-item{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);padding:4px 10px;border:none;border-bottom:1px solid #d5d9e0;background:#fff;color:#1a1a1a;font-family:var(--font-report);font-size:13px;text-align:left}
body.tablet .ck-item{font-size:14px}
.ck-item .n{width:20px;text-align:right;font-weight:700;color:#475467;flex-shrink:0}
.ck-item.on{background:#eef4fd}
.ck-item,.vg-c,.ck-yn{transition:background .12s}
.ck-item:active,.vg-c:active,.ck-yn:active{background:#e3ecfa}
.ck-item:focus-visible,.vg-c:focus-visible,.ck-yn:focus-visible{outline:3px solid #1b5db5;outline-offset:-3px}
.ck-other{display:flex;align-items:center;gap:10px;padding:4px 10px;min-height:var(--tap);font-size:13px}
.ck-other .xr-in{border-bottom:1px solid #c3cad6;border-radius:0}
.ck2{width:100%;border-collapse:collapse}
.ck2 th{font-size:11px;font-weight:700;background:#f7f7f7;border-bottom:1px solid #999;padding:4px 8px;text-align:left}
.ck2 th.c{text-align:center;width:88px;border-left:1px solid #999}
.ck2 td{border-bottom:1px solid #d5d9e0;padding:2px 8px;font-size:13px}
body.tablet .ck2 td{font-size:14px}
.ck2 td.c{text-align:center;border-left:1px solid #999;padding:2px}
.ck-yn{width:100%;min-height:var(--tap);border:none;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-ui);font-size:13px;font-weight:600;color:#475467}
.ck-yn.on.sim{background:#e6f6ed;color:#1e7a43}.ck-yn.on.sim .ck-box{background:#1e8a4a;border-color:#1e8a4a}
.ck-yn.on.nao{background:#fdecea;color:#b42318}
.ck-yn.on.nao .ck-box{background:#b42318;border-color:#b42318}
.ck-yn.on.nao .ck-box::after{content:"✕"}
.ck-com{padding:6px 10px;border-bottom:1px solid #999;border-top:1px solid #999;display:flex;flex-direction:column;gap:4px}
.ck-com label{font-size:11px;font-weight:700;color:#344054;text-transform:uppercase;letter-spacing:.05em}
.ck-com textarea{width:100%;min-height:44px;border:1px solid #c3cad6;border-radius:4px;padding:6px 8px;font-family:var(--font-report);font-size:var(--fs-in);color:#1a1a1a;background:#fff;resize:vertical}
.ck-com .ro{font-size:12px;min-height:30px;white-space:pre-wrap}
.ck-alert{padding:8px 16px;text-align:center;font-size:11.5px;font-weight:600;color:#475467;background:#f7f8fa;text-wrap:balance;border-bottom:1px solid #999}
.ck-alert.bad{background:#fdecea;color:#b42318;font-weight:700}
.vg{display:grid;grid-template-columns:132px repeat(6,minmax(0,1fr));border-bottom:1px solid #999}
.vg-hd{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;padding:4px 10px;font-size:11px;font-weight:600;color:#475467;background:#f7f7f7;border-bottom:1px solid #999;font-family:var(--font-ui)}
.vg-lb{background:#e8701a;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #fff;letter-spacing:.01em}
.vg-c{display:flex;align-items:center;gap:8px;min-width:0;min-height:52px;padding:6px 8px;border:none;border-left:1px solid #e1e5eb;border-bottom:1px solid #e1e5eb;background:#fff;color:#1a1a1a;font-family:var(--font-report);text-align:left}
.vg-c.x{background:#fafbfc}
.vg-c .t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.vg-c b{font-size:13px;font-weight:700;white-space:nowrap}
.vg-c small{font-size:11px;color:#667085;white-space:nowrap}
.vg-c .ck-box{width:20px;height:20px;font-size:13px}
.vg-c.on{background:#eef4fd}.vg-c.on small{color:#1b5db5;font-weight:700}
.ck-note{font-size:11px;color:#475467;padding:6px 10px;font-family:var(--font-ui)}

/* fotos */
.xr-photos{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #999}
.xr-slot{margin:4px;position:relative;overflow:hidden;border-radius:3px;aspect-ratio:4/3;background:#f3f4f6;display:flex;align-items:center;justify-content:center;max-width:100%}
.xr-slot img{width:100%;height:100%;object-fit:contain;display:block;background:#eef0f3}
.xr-slot.empty{border:1.5px dashed #c3cad6;margin:8px;color:#6b7686;font-size:12px;font-family:var(--font-ui);flex-direction:column;gap:8px;text-align:center;padding:8px}
body.pc .xr-slot.empty.clickable{cursor:pointer}
body.pc .xr-slot.empty.clickable:hover,.xr-slot.empty.dragover{background:#e7effc;border-color:#1b5db5;color:#1b5db5}
.xr-slot .big{width:34px;height:34px;stroke-width:1.6}
.xr-cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);padding:2px 4px}
.xr-cap input,.xr-cap div{width:100%;border:none;outline:none;font-size:11px;font-family:var(--font-report);padding:3px 4px;background:rgba(255,255,255,.9);color:#222;text-align:center;min-height:24px}
body.tablet .xr-cap input{min-height:34px;font-size:13px}
.xr-del{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(20,24,32,.75);color:#fff;display:flex;align-items:center;justify-content:center}
body.tablet .xr-del{width:42px;height:42px}
body.pc .xr-slot .xr-del{opacity:0;transition:opacity .15s}
body.pc .xr-slot:hover .xr-del,body.pc .xr-slot:focus-within .xr-del{opacity:1}
.xr-mark{position:absolute;top:6px;left:44px;min-height:34px;padding:0 12px;border-radius:99px;border:none;background:rgba(20,24,32,.78);color:#fff;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:13px;font-weight:700}
body.tablet .xr-mark{min-height:42px;padding:0 16px;font-size:14px}
.xr-mark:active{background:#1b5db5}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 12px 0 8px;border:1px solid #c3cad6;border-radius:8px;background:#fff;color:#1a1a1a;font-family:var(--font-report);font-size:13px;font-weight:600;white-space:nowrap;transition:background .12s}
body.tablet .opt{font-size:14px}
button.opt{cursor:pointer}button.opt:active{background:#e3ecfa}
.opt.on{background:#eef4fd;border-color:#1b5db5;color:#144895}
.opt-other{margin:0 0 6px;border-bottom:1px solid #c3cad6;border-radius:0}
.opt-ro{font-size:11px;margin-left:8px}
.anc-c{width:300px}
.ck-ack{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:none;border-bottom:1px solid #999;background:#fff5f4;color:#b42318;font-family:var(--font-report);font-size:14px;font-weight:800;text-align:left;cursor:pointer}
.ck-ack .tx{flex:1}
.ck-ack .lb{font-family:var(--font-ui);font-size:12px;font-weight:700;color:#b42318;border:1.5px solid currentColor;border-radius:99px;padding:3px 10px;white-space:nowrap}
.ck-ack .ck-box{border-color:#b42318}
.ck-ack.on .ck-box{background:#b42318;border-color:#b42318}
.ck-ack.on .lb{background:#b42318;color:#fff;border-color:#b42318}
/* editor de marcação nas fotos */
.mk{position:fixed;inset:0;z-index:130;background:#0d141c;display:flex;flex-direction:column;font-family:var(--font-ui)}
.mk-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));background:#14202c;color:#fff}
.mk-grp{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:12px}
.mk-b{min-height:44px;min-width:44px;padding:0 12px;border-radius:9px;border:none;background:transparent;color:#dbe4ee;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.mk-b:hover{background:rgba(255,255,255,.1)}
.mk-b.on{background:#fff;color:#14202c}
.mk-b:disabled{opacity:.35}
.mk-sw{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.mk-b.on .mk-sw{box-shadow:inset 0 0 0 2px #14202c,0 0 0 2px #fff}
.mk-sp{flex:1}
.mk-save{background:#1b5db5;color:#fff}.mk-save:hover{background:#144895}
.mk-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.mk-body canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.mk-tip{font-size:12px;color:#93a3b5;padding:0 16px 8px;background:#14202c}
.xr-n{position:absolute;left:6px;top:6px;background:rgba(20,24,32,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;font-family:var(--font-ui)}
.xr-kb{position:absolute;right:6px;bottom:36px;background:rgba(20,24,32,.72);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;font-family:var(--font-ui);font-variant-numeric:tabular-nums}

/* assinaturas */
.xr-sigs{display:flex}
.xr-sig{flex:1;min-width:0}
.xr-sig-h{font-size:11px;font-weight:700;text-align:center;padding:5px 8px;border-bottom:1px solid #999;background:#f7f7f7;min-height:24px}
.xr-sig-b{min-height:110px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.xr-sig-b img{max-width:100%;max-height:60px;object-fit:contain;display:block}
.xr-sig-n{font-size:11px;text-align:center;color:#333}
.xr-sig-d{font-size:11px;color:#333;font-weight:700}
.xr-sig-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.xr-div{width:0;border-right:none;border-left:1px solid #999;border-right:1px solid #999;flex-shrink:0}

/* ── OVERLAYS ── */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:100;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-head h3{font-size:17px;font-weight:800;flex:1}
.drawer-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.hitem{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.hitem.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.hitem .d{font-weight:800;font-size:15px}
.hitem .s{font-size:13px;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .m{font-size:12px;color:var(--text-muted)}
.hitem .a{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-light);color:var(--accent);margin-left:6px;vertical-align:middle}
.carry{display:flex;flex-direction:column;gap:8px;background:var(--accent-light);border-radius:var(--r);padding:12px}
.carry b{font-size:14px}.carry span{font-size:13px;color:var(--text-mid);line-height:1.45}
.dialog{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog.wide{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dialog h3{font-size:18px;font-weight:800}
.dialog p{color:var(--text-mid);font-size:14px}
.dialog .a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.viewer{position:fixed;inset:0;z-index:120;background:rgba(10,16,24,.92);display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));color:#fff}
.viewer-bar b{flex:1;font-size:15px}
.viewer-body{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.viewer-body img{display:block;width:180%;max-width:none;height:auto;background:#fff;margin:0 auto}
.viewer.fit .viewer-body img{width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14202c;color:#fff;padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:14px;z-index:200;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.sig-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sig-card{border:1.5px solid var(--border);border-radius:var(--r);padding:12px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;min-height:var(--tap)}
.sig-card:hover,.sig-card:focus-visible{border-color:var(--accent);background:var(--accent-light)}
.sig-card img{max-height:46px;max-width:100%;background:#fff;border-radius:4px}
.sig-card b{font-size:13px}.sig-card span{font-size:12px;color:var(--text-muted)}
.sig-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.sig-form canvas{grid-column:1/-1;width:100%;max-width:320px;height:auto;background:#fff;border:1px solid var(--border);border-radius:6px}
.sig-form .a{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}

#printArea{display:none}
@media (max-width:1180px){.save-state{display:none}}
@media (max-width:960px){.top-actions .lbl-hide:not(.keep){display:none}}
@media (max-width:520px){.top-actions .lbl-hide.keep{display:none}}
.xr-fields tr.sm-only{display:none}
@media (max-width:760px){
  .xr-head{grid-template-columns:1fr 1fr}
  .xr-head h1{grid-column:1/-1;order:-1;border-bottom:1px solid #999;font-size:17px}
  .xr-head .lg.r{border-left:none}

  .sig-form{grid-template-columns:1fr}
  .xr-fields td.k{width:96px}

  .xr-fields tr.sm-only{display:table-row}
}

  #printArea .vg-c{min-height:0;height:31px;padding:2px 5px;gap:5px}#printArea .vg-c .ck-box{width:12px;height:12px;font-size:9px}

  #printArea .sp{flex:1}
  #printArea .opts{padding:1px 0;gap:10px}#printArea .opt{min-height:0;padding:0;border:none;background:#fff;font-size:10px;gap:4px;font-weight:600;color:#1a1a1a}

const store={

  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
const PH={};
const idb={
  db:null,ok:true,
  open(){if(this.db||!this.ok)return Promise.resolve(this.db);
    return new Promise(res=>{try{const rq=indexedDB.open(PREFIX+'-data',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('p');
      rq.onsuccess=()=>{this.db=rq.result;res(this.db)};rq.onerror=()=>{this.ok=false;res(null)};
    }catch(e){this.ok=false;res(null)}})},
  async tx(mode,fn){const db=await this.open();if(!db)return null;
    return new Promise(res=>{try{const t=db.transaction('p',mode),s=t.objectStore('p');const r=fn(s);
      t.oncomplete=()=>res(r&&'result' in r?r.result:true);t.onerror=()=>res(null)}catch(e){res(null)}})},
  put(id,v){return this.tx('readwrite',s=>s.put(v,id))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  keys(){return this.tx('readonly',s=>s.getAllKeys())}
};

function blankReport(){return {id:uid(),unit:DEFAULT_UNIT,modulo:'',anc:{},andaime:{},andaimeOutro:'',ciencia:false,estr:{},outros:'',cond:{},coment:'',vigas:{},date:todayISO(),photos:[],sig:[null,null,null],createdAt:Date.now(),updatedAt:Date.now()}}
function normalize(r){r=Object.assign(blankReport(),r||{});
  if(!Array.isArray(r.photos))r.photos=[];r.photos=r.photos.slice(0,MAX_PHOTOS);
  if(!Array.isArray(r.sig))r.sig=[];while(r.sig.length<ROLES.length)r.sig.push(null);
  for(const k of ['estr','cond','vigas','anc','andaime'])if(!r[k]||typeof r[k]!=='object')r[k]={};delete r.tipo;return r}
const photoRefs=r=>(r&&r.photos||[]).map(x=>x.id);
const isBlank=r=>!r.modulo&&!Object.keys(r.estr).length&&!Object.keys(r.vigas).length&&!String(r.outros||'').trim()&&!photoRefs(r).length;

function touch(){R.updatedAt=Date.now();$('#saveState').classList.add('saving');$('#saveText').textContent='Salvando…';clearTimeout(saveT);saveT=setTimeout(persist,400);renderBrand();renderStatus()}
function persist(){
  const ok1=store.set(K.cur,R);
  const i=history.findIndex(h=>h.id===R.id);const snap=JSON.parse(JSON.stringify(R));
  if(i>=0)history[i]=snap;else if(!isBlank(R))history.push(snap);
  history.sort((a,b)=>b.updatedAt-a.updatedAt);
  const ok2=store.set(K.hist,history);
  clearTimeout(persist.g);persist.g=setTimeout(gcPhotos,3000);
  $('#saveState').classList.remove('saving');$('#saveText').textContent=(ok1&&ok2)?'Salvo neste aparelho':'Não foi possível salvar neste aparelho';
}
async function loadPhotos(r){for(const id of photoRefs(r))if(!PH[id]){const v=await idb.get(id);if(v)PH[id]=v}}
async function gcPhotos(){const keys=await idb.keys();if(!keys)return;const used=new Set([...history.flatMap(photoRefs),...photoRefs(R)]);

function genSigImage(nome){
  const c=document.createElement('canvas');c.width=320;c.height=80;const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  const fs=nome.length>20?28:nome.length>14?32:38;
  ctx.font='italic '+fs+'px Georgia, serif';ctx.fillStyle='#1a1a2e';ctx.textBaseline='middle';
  ctx.save();ctx.translate(10,c.height/2+4);ctx.rotate(-0.04);
  let x=0;nome.split('').forEach((ch,i)=>{ctx.fillText(ch,x,Math.sin(i*0.7)*3);x+=ctx.measureText(ch).width});
  ctx.restore();ctx.beginPath();ctx.moveTo(8,c.height-12);
  ctx.bezierCurveTo(c.width*0.3,c.height-8,c.width*0.7,c.height-16,c.width-10,c.height-10);
  ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1.5;ctx.stroke();
  return c.toDataURL('image/png');
}

function compressImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,PHOTO_MAX_PX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);const data=c.toDataURL('image/jpeg',PHOTO_Q);res({data,w,h,kb:Math.round(data.length*0.75/1024)})};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
async function addPhotos(files){
  let list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!list.length){toast('Nenhuma imagem encontrada nos arquivos escolhidos.');return}
  const free=MAX_PHOTOS-R.photos.length;
  if(free<=0){toast('O plano já tem 4 fotos. Remova uma para adicionar outra.');return}
  const extra=list.length-free;list=list.slice(0,free);
  toast(`Comprimindo ${list.length} foto(s)…`);
  let before=0,after=0,fail=0;
  for(const f of list){
    try{const v=await compressImage(f);const id='p'+uid();PH[id]=v;R.photos.push({id,cap:''});before+=f.size/1024;after+=v.kb;
      if(!await idb.put(id,v)&&!idb.warned){idb.warned=true;toast('Este navegador não permite guardar fotos. Gere o PDF antes de fechar.')}
    }catch(e){fail++}
  }
  refreshSheet(1);touch();buildPrintImages();
  if(fail)toast(`${fail} arquivo(s) não puderam ser lidos como imagem.`);
  else toast(`Foto(s) comprimida(s): ${fmtKB(Math.round(before))} → ${fmtKB(after)}${extra>0?` · ${extra} ignorada(s), limite de 4`:''}`);
}

/* ───────── MARCAÇÃO NAS FOTOS (setas, círculos, caixas) ─────────
   A foto original fica guardada (orig) e as marcas em coordenadas 0–1 (marks), para poder editar de novo.
   O que aparece na folha e no PDF é a imagem já com as marcas (data). */
const MK_TOOLS=[{id:'arrow',t:'Seta',i:'arrow'},{id:'circle',t:'Círculo',i:'circle'},{id:'box',t:'Caixa',i:'square'}];
const MK_COLORS=[{c:'#e11d1d',t:'Vermelho'},{c:'#facc15',t:'Amarelo'},{c:'#ffffff',t:'Branco'}];
function drawMark(g,m,W,H){
  const lw=Math.max(4,Math.round(Math.max(W,H)*0.006));
  const x1=m.x1*W,y1=m.y1*H,x2=m.x2*W,y2=m.y2*H;
  g.save();g.strokeStyle=m.c;g.fillStyle=m.c;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
  g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=lw*1.2;
  g.beginPath();
  if(m.t==='box'){g.rect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));g.stroke()}
  else if(m.t==='circle'){g.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(1,Math.abs(x2-x1)/2),Math.max(1,Math.abs(y2-y1)/2),0,0,Math.PI*2);g.stroke()}
  else{const a=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1),h=Math.min(Math.max(lw*4.5,len*0.22),lw*9);
    g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*0.6,y2-Math.sin(a)*h*0.6);g.stroke();
    g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45));g.lineTo(x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45));g.closePath();g.fill()}
  g.restore();
}
async function openMarker(j){
  const p=R.photos[j];if(!p||!PH[p.id])return;const v=PH[p.id];const base=v.orig||v.data;
  let im;try{im=await loadImg(base)}catch(e){toast('Não foi possível abrir a foto.');return}
  const W=im.naturalWidth,H=im.naturalHeight;let marks=JSON.parse(JSON.stringify(v.marks||[]));let tool='arrow',color=MK_COLORS[0].c,cur=null;
  const M=document.createElement('div');M.className='mk';M.setAttribute('role','dialog');M.setAttribute('aria-modal','true');M.setAttribute('aria-label',`Marcar foto ${j+1}`);
  M.innerHTML=`<div class="mk-bar">
      <div class="mk-grp" role="group" aria-label="Ferramenta">${MK_TOOLS.map(x=>`<button type="button" class="mk-b" data-tool="${x.id}" aria-label="${x.t}">${icon(x.i)}<span class="t">${x.t}</span></button>`).join('')}</div>
      <div class="mk-grp" role="group" aria-label="Cor">${MK_COLORS.map(x=>`<button type="button" class="mk-b" data-color="${x.c}" aria-label="${x.t}"><span class="mk-sw" style="background:${x.c}"></span></button>`).join('')}</div>
      <div class="mk-grp"><button type="button" class="mk-b" data-undo aria-label="Desfazer">${icon('undo')}<span class="t">Desfazer</span></button><button type="button" class="mk-b" data-clear aria-label="Limpar marcas">${icon('trash')}<span class="t">Limpar</span></button></div>
      <span class="mk-sp"></span>
      <button type="button" class="mk-b" data-cancel>Cancelar</button><button type="button" class="mk-b mk-save" data-save>${icon('save')}Salvar</button></div>
    <div class="mk-tip">Arraste o dedo sobre a foto para desenhar. Foto ${j+1} de ${R.photos.length}.</div>
    <div class="mk-body"><canvas width="${W}" height="${H}" aria-label="Foto ${j+1} para marcação"></canvas></div>`;
  document.body.appendChild(M);
  const cv=M.querySelector('canvas'),g=cv.getContext('2d');
  const draw=()=>{g.drawImage(im,0,0,W,H);marks.forEach(m=>drawMark(g,m,W,H));if(cur)drawMark(g,cur,W,H)};
  const sync=()=>{M.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));
    M.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('on',b.dataset.color===color));
    M.querySelector('[data-undo]').disabled=!marks.length;M.querySelector('[data-clear]').disabled=!marks.length};
  const pos=e=>{const r=cv.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);cur={t:tool,c:color,x1:x,y1:y,x2:x,y2:y};draw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;const [x,y]=pos(e);cur.x2=x;cur.y2=y;draw()});
  const end=()=>{if(!cur)return;if(Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>0.015)marks.push(cur);cur=null;draw();sync()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{cur=null;draw()});
  M.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;sync()});
  M.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;sync()});
  M.querySelector('[data-undo]').onclick=()=>{marks.pop();draw();sync()};
  M.querySelector('[data-clear]').onclick=()=>{marks=[];draw();sync()};
  const close=()=>{M.remove();document.removeEventListener('keydown',onKey,true)};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();marks.pop();draw();sync()}};
  document.addEventListener('keydown',onKey,true);
  M.querySelector('[data-cancel]').onclick=close;
  M.querySelector('[data-save]').onclick=async()=>{
    cur=null;draw();let nv;
    if(marks.length){const data=cv.toDataURL('image/jpeg',0.85);nv={data,orig:base,marks,w:W,h:H,kb:Math.round(data.length*0.75/1024)}}
    else nv={data:base,w:W,h:H,kb:Math.round(base.length*0.75/1024)};
    PH[p.id]=nv;await idb.put(p.id,nv);close();refreshSheet(1);touch();buildPrintImages();
    toast(marks.length?`${marks.length} marcação(ões) salva(s) na foto ${j+1}.`:`Marcações removidas da foto ${j+1}.`)};
  draw();sync();
}

/* ───────── PDF: fotos reduzidas ───────── */
const PDF_PHOTO_MAX=280e3;const PRN={};
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
async function shrinkJpeg(data,maxBytes,L){const im=await loadImg(data);const c=document.createElement('canvas'),g=c.getContext('2d');let l=L,q=0.72,out=data;
  for(let k=0;k<14;k++){const sc=Math.min(1,l/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
    g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
    if(out.length*0.75<=maxBytes)break;if(q>0.5)q=Math.round((q-0.07)*100)/100;else{l=Math.round(l*0.82);if(l<420)break}}return out}
async function buildPrintImages(){
  for(const id of photoRefs(R).filter(id=>PH[id])){const c=PRN[id];if(c&&c.src===PH[id].data)continue;try{PRN[id]={src:PH[id].data,data:await shrinkJpeg(PH[id].data,PDF_PHOTO_MAX,1100)}}catch(e){}}
}
const printSrc=id=>(PRN[id]&&PRN[id].src===PH[id].data)?PRN[id].data:PH[id].data;
function preparePrint(){ // também roda no "beforeprint" (menu do navegador)
  $('#printArea').innerHTML=SHEETS.map(f=>f(false)).join('');
  document.title=[FILE,slug(R.modulo)||'sem-modulo',R.date].filter(Boolean).join('_');
}
window.addEventListener('beforeprint',preparePrint);
async function printReport(){
  persist();
  if(!R.modulo){toast('Selecione o módulo da unidade antes de gerar o PDF.');$('#fMod')?.focus();return}
  if(!Object.keys(R.anc).length){toast('Marque o tipo de ancoragem (Vertical e/ou Horizontal).');return}
  if(!Object.keys(R.andaime).length){toast('Marque pelo menos um tipo de andaime.');return}
  if(!Object.keys(R.estr).length&&!String(R.outros||'').trim()){toast('Marque pelo menos um tipo de estrutura no item 1.');document.querySelector('[data-estr]')?.scrollIntoView({block:'center'});return}
  const miss=CONDICOES.filter(c=>!R.cond[c.id]).length;
  if(miss){toast(`Responda Sim ou Não nas ${miss} condição(ões) visual(is) pendente(s) do item 2.`);document.querySelector('[data-cond]')?.scrollIntoView({block:'center'});return}
  if(!Object.keys(R.vigas).length){toast('Marque pelo menos um tipo de viga ou perfil no item 3.');document.querySelector('[data-viga]')?.scrollIntoView({block:'center'});return}
  if(!R.ciencia){toast('Marque a ciência da nota abaixo do item 3 (tubulação / equipamentos).');document.querySelector('[data-ack]')?.scrollIntoView({block:'center'});return}
  if(anyNao()&&!await confirmBox('Condição visual negativa','Há resposta "Não" no item 2: a estrutura não pode ser usada como ponto de ancoragem. Gerar o PDF mesmo assim, para registro?','Gerar PDF',true))return;
  if(!R.photos.length)toast('O plano ainda não tem fotos. O PDF sairá com a área de fotos vazia.');
  else{toast('Preparando o PDF…');await buildPrintImages()}
  preparePrint();setTimeout(()=>window.print(),150);
}

/* ───────── ASSINATURAS ───────── */
function openSigManager(slot){
  const M=document.createElement('div');M.className='overlay center';
  const role=slot==null?'':ROLES[slot];
  const draw=()=>{
    const list=slot==null?SIGS:[...SIGS].sort((a,b)=>(b.cargo===role)-(a.cargo===role));
    M.innerHTML=`<div class="dialog wide" role="dialog" aria-modal="true">
    <h3>${slot==null?'Assinaturas cadastradas':`Selecionar · ${esc(role)}`}</h3>
    ${list.length?`<div class="sig-list">${list.map(s=>`<div class="sig-card" tabindex="0" data-use="${s.id}"><img src="${s.img}" alt=""><b>${esc(s.nome)}</b><span>${esc(s.cargo)}</span>
        ${slot==null?`<button type="button" class="btn sm ghost danger" data-sdel="${s.id}">${icon('trash')}Remover</button>`:''}</div>`).join('')}</div>`
      :`<p>Nenhuma assinatura cadastrada. Cadastre abaixo com nome e cargo; a assinatura é gerada automaticamente.</p>`}
    <div class="sig-form">
      <div class="field"><label for="sg-nome">Nome completo</label><input class="in" id="sg-nome" placeholder="Ex: João da Silva" autocomplete="off"></div>
      <div class="field"><label for="sg-cargo">Cargo / função</label><input class="in" id="sg-cargo" list="dlRoles" value="${esc(role)}" placeholder="Ex: Scaffolding Supervisor" autocomplete="off"></div>
      <canvas id="sg-prev" width="320" height="80" aria-label="Prévia da assinatura"></canvas>
      <div class="a"><button type="button" class="btn primary" data-sadd>${icon('plus')}${slot==null?'Cadastrar assinatura':'Cadastrar e usar'}</button></div>
    </div>
    <datalist id="dlRoles">${ROLES.map(r=>`<option value="${r}">`).join('')}</datalist>
    <div class="a"><button type="button" class="btn" data-sclose>Fechar</button></div></div>`;
    const prev=M.querySelector('#sg-prev'),nm=M.querySelector('#sg-nome');
    const paint=()=>{const g=prev.getContext('2d');const v=nm.value.trim();if(!v){g.fillStyle='#f5f5f5';g.fillRect(0,0,320,80);return}const im=new Image();im.onload=()=>g.drawImage(im,0,0);im.src=genSigImage(v)};
    paint();nm.addEventListener('input',paint);
    M.querySelector('[data-sclose]').onclick=()=>M.remove();
    M.querySelector('[data-sadd]').onclick=()=>{const nome=nm.value.trim(),cargo=M.querySelector('#sg-cargo').value.trim();
      if(!nome||!cargo){toast('Preencha nome e cargo para gerar a assinatura.');return}
      const s={id:'s'+uid(),nome,cargo,img:genSigImage(nome)};SIGS.push(s);store.set(K.sigs,SIGS);
      if(slot!=null){applySig(slot,s);M.remove()}else{draw();toast('Assinatura cadastrada.')}};
    M.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();SIGS=SIGS.filter(x=>x.id!==b.dataset.sdel);store.set(K.sigs,SIGS);draw()});
    M.querySelectorAll('[data-use]').forEach(c=>{const go=()=>{if(slot==null)return;applySig(slot,SIGS.find(x=>x.id===c.dataset.use));M.remove()};
      c.onclick=go;c.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}}});
  };
  draw();M.onclick=e=>{if(e.target===M)M.remove()};document.body.appendChild(M);
}
function applySig(slot,s){if(!s)return;R.sig[slot]={nome:s.nome,cargo:s.cargo,img:s.img};refreshSheet(1);touch()}

/* ───────── PLANOS SALVOS ───────── */
function openHistory(){
  persist();
  const L=$('#layer');
  const items=history.map(h=>{const r=normalize(JSON.parse(JSON.stringify(h)));
    return `<div class="hitem ${h.id===R.id?'cur':''}"><div class="d">${esc(r.modulo||'Sem módulo')}${CONDICOES.some(c=>r.cond[c.id]==='nao')?' <span class="tag" style="background:var(--danger-bg);color:var(--danger)">reprovado</span>':''}${h.id===R.id?'<span class="tag">aberto</span>':''}</div>
      <div class="s">${esc([...ESTRUTURAS.filter(x=>r.estr[x.id]).map(x=>x.t),r.outros].filter(Boolean).join(' · ')||'Nenhuma estrutura marcada')}</div>
      <div class="m">Data ${fmtDate(r.date)||'—'} · ${r.photos.length} foto(s) · editado em ${fmtDT(r.updatedAt)}</div>
      <div class="a">${h.id!==R.id?`<button class="btn sm" type="button" data-open="${h.id}">${icon('file')}Abrir</button>`:''}
        <button class="btn sm" type="button" data-dup="${h.id}">${icon('copy')}Duplicar</button>
        <button class="btn sm ghost danger" type="button" data-rm="${h.id}" aria-label="Excluir plano">${icon('trash')}</button></div></div>`}).join('');
  L.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Planos salvos"><aside class="drawer">
    <div class="drawer-head"><h3>Planos salvos</h3><button class="btn ghost" type="button" data-close aria-label="Fechar">${icon('x')}</button></div>
    <div class="drawer-body"><button class="btn primary" type="button" data-new>${icon('plus')}Novo plano</button>${items||'<p class="note">Nenhum plano salvo ainda. Ele aparece aqui assim que você escolher o módulo, marcar um item ou adicionar uma foto.</p>'}</div>
    <div class="drawer-foot">
      <div class="carry"><b>Levar para outro aparelho</b><span>Gera uma cópia do app com todos os planos, fotos e assinaturas dentro do arquivo. Copie para o outro aparelho e abra: os dados aparecem sozinhos.</span>
        <button class="btn primary" type="button" data-carry>${icon('download')}Gerar app com os dados</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-backup>${icon('download')}Backup (.json)</button><button class="btn sm" type="button" data-restore>${icon('upload')}Restaurar backup</button></div>
    </div></aside></div>`;
  const close=()=>L.innerHTML='';
  L.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};
  L.querySelector('[data-close]').onclick=close;
  L.querySelector('[data-new]').onclick=()=>{const keep={unit:R.unit,sig:R.sig};R=blankReport();R.unit=keep.unit;R.sig=keep.sig.map(s=>s&&{...s});persist();render();close();window.scrollTo({top:0});toast('Novo plano criado com a mesma unidade e assinaturas.')};
  L.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{R=normalize(JSON.parse(JSON.stringify(history.find(h=>h.id===b.dataset.open))));await loadPhotos(R);persist();render();close();window.scrollTo({top:0});buildPrintImages()});
  L.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{const src=normalize(JSON.parse(JSON.stringify(history.find(h=>h.id===b.dataset.dup))));src.id=uid();src.createdAt=src.updatedAt=Date.now();src.date=todayISO();R=src;await loadPhotos(R);persist();render();close();window.scrollTo({top:0});toast('Cópia criada. Ajuste o módulo e as fotos se for outro local.')});
  L.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('Excluir plano?','O plano será apagado deste aparelho.','Excluir',true)){openHistory();return}
    history=history.filter(x=>x.id!==b.dataset.rm);store.set(K.hist,history);
    if(b.dataset.rm===R.id){const nx=history[0];R=nx?normalize(JSON.parse(JSON.stringify(nx))):blankReport();await loadPhotos(R);store.set(K.cur,R);render()}else persist();
    gcPhotos();toast('Plano excluído.');openHistory()});
  L.querySelector('[data-backup]').onclick=async()=>{const d=await collectAll();downloadBlob(new Blob([JSON.stringify(d)],{type:'application/json'}),`${FILE}_backup_${todayISO()}.json`)};
  L.querySelector('[data-restore]').onclick=()=>$('#fileImport').click();
  L.querySelector('[data-carry]').onclick=async()=>{const b=L.querySelector('[data-carry]');b.disabled=true;b.textContent='Gerando arquivo…';await exportAppWithData();b.disabled=false;b.innerHTML=icon('download')+'Gerar app com os dados'};
}
async function collectAll(){
  persist();const photos={};for(const id of new Set([...history.flatMap(photoRefs),...photoRefs(R)])){const v=PH[id]||await idb.get(id);if(v)photos[id]=v}
  return {app:PREFIX,version:1,seedId:uid(),exportedAt:new Date().toISOString(),currentId:R.id,history,sigs:SIGS,photos};
}
async function mergeData(d){
  for(const [id,v] of Object.entries(d.photos||{})){PH[id]=v;await idb.put(id,v)}
  const map=new Map(history.map(h=>[h.id,h]));(d.history||[]).forEach(h=>{const c=map.get(h.id);if(!c||(h.updatedAt||0)>=(c.updatedAt||0))map.set(h.id,h)});
  history=[...map.values()].sort((a,b)=>b.updatedAt-a.updatedAt);store.set(K.hist,history);
  if(Array.isArray(d.sigs)){const sm=new Map(SIGS.map(x=>[x.id,x]));d.sigs.forEach(x=>sm.set(x.id,x));SIGS=[...sm.values()];store.set(K.sigs,SIGS)}
}
async function exportAppWithData(){
  try{const data=await collectAll();const clone=document.documentElement.cloneNode(true);
    ['#doc','#layer','#printArea'].forEach(s=>{const el=clone.querySelector(s);if(el)el.innerHTML=''});
    clone.querySelectorAll('.toast,.overlay,.viewer').forEach(el=>el.remove());clone.querySelector('#topLogo')?.removeAttribute('src');
    clone.querySelector('#app-seed').textContent=JSON.stringify(data).replace(/<\//g,'<\\/');
    downloadBlob(new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),`${FILE}_${DEVICE==='pc'?'PC':'Tablet'}_com_dados_${todayISO()}.html`);
    toast(`Arquivo gerado com ${data.history.length} plano(s) e ${Object.keys(data.photos).length} foto(s).`);
  }catch(e){console.error(e);toast('Não foi possível gerar o arquivo. Use o Backup (.json).')}
}
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(d.app!==PREFIX)throw 0;await mergeData(d);render();openHistory();toast(`Backup restaurado: ${(d.history||[]).length} plano(s).`)}
    catch(err){toast('Arquivo inválido. Escolha um backup .json gerado por este app.')}};rd.readAsText(f);e.target.value=''});
async function applySeed(){
  let d=null;try{d=JSON.parse($('#app-seed').textContent)}catch(e){}
  if(!d||d.app!==PREFIX||!d.seedId)return;const applied=store.get(K.seeds,[]);if(applied.includes(d.seedId))return;
  await mergeData(d);const cur=history.find(h=>h.id===d.currentId);if(cur)R=normalize(JSON.parse(JSON.stringify(cur)));
  applied.push(d.seedId);store.set(K.seeds,applied);
  setTimeout(()=>toast(`Dados do arquivo carregados: ${(d.history||[]).length} plano(s), ${Object.keys(d.photos||{}).length} foto(s).`),300);
}

/* ───────── INIT ───────── */
$('#topLogo').src=LOGO_FPSO;
$('#btnHistory').onclick=openHistory;$('#btnSigs').onclick=()=>openSigManager(null);$('#btnPrint').onclick=printReport;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#layer').innerHTML)$('#layer').innerHTML='';else document.querySelector('.overlay')?.remove()}});
render();
(async()=>{await applySeed();await loadPhotos(R);render();persist();buildPrintImages()})();
